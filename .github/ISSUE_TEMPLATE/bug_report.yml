name: Bug report
description: Something in dsh-server-manager does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove passwords, key contents and internal hostnames before posting.
        For security issues use the private advisory link in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: dsh
    attributes:
      label: DSH version and OS
      placeholder: DSH 0.2.2-rc.1, Windows 11
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Panel / right-sidebar UI
        - server_status probe
        - server_exec
        - transfer / SFTP
        - deploy / rollback
        - logs / services
        - configuration / server_manage
        - installation / loading
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Tool call, panel action or configuration (redact secrets).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the error text and, if relevant, the last audit lines.
      render: text
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target server OS
      placeholder: Ubuntu 24.04
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed credentials and private hostnames from this report.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
